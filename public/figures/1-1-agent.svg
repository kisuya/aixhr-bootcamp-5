<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-labelledby="t d">
<title id="t">Agent가 일하는 순서</title>
<desc id="d">다음 행동을 정하고, 도구로 실행하고, 결과를 확인한다. 더 할 일이 있으면 결과를 반영해 되풀이한다. 일이 끝나거나, 허락이 필요하거나, 막히면 멈추고 사람에게 알린다.</desc>
<style>text{font-family:'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;} .h{font-weight:700;font-size:18px} .s{font-size:14px;fill:#5b6670} .c{font-size:14px;fill:#5b6670}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6670"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4532a"/></marker></defs>
<rect x="0" y="0" width="720" height="252" rx="16" fill="#ffffff"/>
<rect x="20" y="24" width="200" height="80" rx="10" fill="#eef4fc" stroke="#1f5fbf" stroke-width="1.5"/>
<text class="h" x="120.0" y="60.0" text-anchor="middle" fill="#1f5fbf" style="font-size:18px">다음 행동 정하기</text>
<text class="s" x="120.0" y="86.0" text-anchor="middle">어떤 도구로 무엇을 할지</text>
<line x1="224" y1="64" x2="255" y2="64" stroke="#5b6670" stroke-width="2" marker-end="url(#a)"/>
<rect x="260" y="24" width="200" height="80" rx="10" fill="#ecf6f5" stroke="#0f7a72" stroke-width="1.5"/>
<text class="h" x="360.0" y="60.0" text-anchor="middle" fill="#0f7a72" style="font-size:18px">도구로 실행</text>
<text class="s" x="360.0" y="86.0" text-anchor="middle">파일 읽기, 메일 초안 쓰기</text>
<line x1="464" y1="64" x2="495" y2="64" stroke="#5b6670" stroke-width="2" marker-end="url(#a)"/>
<rect x="500" y="24" width="200" height="80" rx="10" fill="#fbf1ec" stroke="#b4532a" stroke-width="1.5"/>
<text class="h" x="600.0" y="60.0" text-anchor="middle" fill="#b4532a" style="font-size:18px">결과 확인</text>
<text class="s" x="600.0" y="86.0" text-anchor="middle">맞는지, 더 할 일이 있는지</text>
<polyline points="560,104 560,130 120,130 120,110" fill="none" stroke="#5b6670" stroke-width="2" marker-end="url(#a)"/>
<text class="c" x="340" y="152" text-anchor="middle">더 할 일이 있으면 결과를 반영해 다시</text>
<polyline points="660,104 660,206 652,206" fill="none" stroke="#b4532a" stroke-width="2" marker-end="url(#ao)"/>
<rect x="80" y="180" width="568" height="52" rx="10" fill="#fbf1ec" stroke="#b4532a" stroke-width="1.5"/>
<text class="c" x="364" y="212" text-anchor="middle" style="fill:#b4532a;font-weight:700">일이 끝나거나, 허락이 필요하거나, 막히면 멈추고 사람에게 알림</text>
</svg>
